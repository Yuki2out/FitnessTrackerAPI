<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitnessTracker — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand"><span class="brand-mark"></span>FITTRACK</a>
        <p>Log your training. Track your progress.</p>
      </div>

      <div class="card">
        <div class="tab-row">
          <button class="tab-btn active" id="tab-login" onclick="showTab('login')">Sign in</button>
          <button class="tab-btn" id="tab-register" onclick="showTab('register')">Create account</button>
        </div>

        <div id="alert" class="alert hidden" role="alert"></div>

        <!-- Login form -->
        <form id="login-form">
          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required autocomplete="email" placeholder="you@example.com" />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••" />
          </div>
          <button type="submit" class="btn btn-block" id="login-submit">Sign in</button>
        </form>

        <!-- Register form -->
        <form id="register-form" class="hidden">
          <div class="row-2">
            <div class="field">
              <label for="reg-firstname">First name</label>
              <input type="text" id="reg-firstname" required maxlength="50" placeholder="Alex" />
            </div>
            <div class="field">
              <label for="reg-lastname">Last name</label>
              <input type="text" id="reg-lastname" required maxlength="50" placeholder="Johnson" />
            </div>
          </div>
          <div class="field">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" required autocomplete="email" placeholder="you@example.com" />
          </div>
          <div class="field">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" />
          </div>
          <button type="submit" class="btn btn-block" id="register-submit">Create account</button>
        </form>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // If already logged in, skip straight to the dashboard.
    if (Auth.isLoggedIn()) {
      window.location.href = "dashboard.html";
    }

    const alertEl = document.getElementById("alert");
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");

    function showTab(which) {
      hideAlert(alertEl);
      const isLogin = which === "login";
      loginForm.classList.toggle("hidden", !isLogin);
      registerForm.classList.toggle("hidden", isLogin);
      tabLogin.classList.toggle("active", isLogin);
      tabRegister.classList.toggle("active", !isLogin);
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      const submitBtn = document.getElementById("login-submit");
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      try {
        const result = await apiFetch("/auth/login", {
          method: "POST",
          auth: false,
          body: {
            email: document.getElementById("login-email").value.trim(),
            password: document.getElementById("login-password").value,
          },
        });
        Auth.setSession(result);
        window.location.href = "dashboard.html";
      } catch (err) {
        showAlert(alertEl, err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
      }
    });

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      const submitBtn = document.getElementById("register-submit");
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account…";

      try {
        const result = await apiFetch("/auth/register", {
          method: "POST",
          auth: false,
          body: {
            firstName: document.getElementById("reg-firstname").value.trim(),
            lastName: document.getElementById("reg-lastname").value.trim(),
            email: document.getElementById("reg-email").value.trim(),
            password: document.getElementById("reg-password").value,
          },
        });
        Auth.setSession(result);
        window.location.href = "dashboard.html";
      } catch (err) {
        showAlert(alertEl, err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
